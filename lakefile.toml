name = "seymour-eight"
version = "1.0.0"
keywords = ["math"]
defaultTargets = ["SeymourEight"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = false
weak.linter.dupNamespace = false
weak.linter.style.maxHeartbeats = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "SeymourEight"
